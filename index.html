<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alexa - demo de voz NOVOMART</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#e8d9a8;font-family:system-ui,sans-serif;text-align:center}
.w{max-width:420px;padding:24px}h1{font-weight:600;font-size:26px;margin:0 0 6px}p{color:#b9ad85;margin:6px 0 22px;font-size:15px}
button{background:#d4af37;color:#111;border:0;border-radius:999px;padding:18px 36px;font-size:18px;font-weight:600;cursor:pointer}
button.stop{background:#8a2a2a;color:#fff}#st{margin-top:18px;font-size:14px;min-height:20px}#lat{font-size:13px;color:#8d8362;margin-top:6px}</style></head><body><div class="w">
<h1>Alexa</h1><p>Demo de voz (OpenAI Realtime, voz Marin). Pulsa y habla en español. Sesión máx. 4 minutos.</p>
<button id="b">Hablar con Alexa</button><div id="st"></div><div id="lat"></div></div><audio id="a" autoplay playsinline></audio>
<script>
const b=document.getElementById('b'),st=document.getElementById('st'),lat=document.getElementById('lat'),au=document.getElementById('a');
let pc,dc,stream,timer,tStop=0,on=false;const TEST=location.search.includes('test=1');
function end(m){on=false;clearTimeout(timer);try{dc&&dc.close()}catch(e){}try{pc&&pc.close()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}b.textContent='Hablar con Alexa';b.className='';st.textContent=m||''}
async function start(){b.disabled=true;st.textContent='Conectando...';
try{
 if(TEST){const c=new AudioContext();const d=c.createMediaStreamDestination();stream=d.stream}else{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
 const r=await fetch('https://gujqbnunbublysaxcfks.supabase.co/functions/v1/openai_realtime_token?k=064bede9960e',{method:'POST'});const j=await r.json();if(!j.value)throw new Error('token: '+JSON.stringify(j).slice(0,120));
 pc=new RTCPeerConnection();pc.ontrack=e=>{au.srcObject=e.streams[0];window.__track=true};
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 dc=pc.createDataChannel('oai-events');window.__ev=[];
 dc.onopen=()=>{st.textContent='Conectado. Habla cuando quieras.';dc.send(JSON.stringify({type:'response.create'}))};
 dc.onmessage=m=>{let e;try{e=JSON.parse(m.data)}catch(x){return}window.__ev.push(e.type+(e.transcript?':'+e.transcript:''));
  if(e.type==='input_audio_buffer.speech_stopped')tStop=performance.now();
  if(e.type==='response.output_audio.delta'&&tStop){lat.textContent='Latencia (fin de tu frase a primer audio): '+Math.round(performance.now()-tStop)+' ms';tStop=0}};
 const o=await pc.createOffer();await pc.setLocalDescription(o);
 const s=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:o.sdp,headers:{Authorization:'Bearer '+j.value,'Content-Type':'application/sdp'}});
 if(!s.ok)throw new Error('sdp '+s.status);await pc.setRemoteDescription({type:'answer',sdp:await s.text()});
 on=true;b.disabled=false;b.textContent='Colgar';b.className='stop';timer=setTimeout(()=>end('Sesión terminada (límite 4 min).'),240000);
}catch(e){b.disabled=false;end('Error: '+e.message)}}
b.onclick=()=>{if(on)end('Llamada terminada.');else start()};
</script></body></html>
